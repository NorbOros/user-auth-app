# Default values for the Helm chart. This is a YAML-formatted file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: {{ .Values.namespace }}

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.userProfileServiceHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-profile-service
                port:
                  number: {{ .Values.userProfileService.port }}